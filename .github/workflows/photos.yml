# Finds a real photo for each bird (Target, the fan wiki, or a resale listing)
# and commits them to photos/. Runs when the bird list changes, or by hand
# from the Actions tab ("Fetch bird photos" > Run workflow).
name: Fetch bird photos
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Bird ids to (re)try, comma separated. Empty = every bird without a photo."
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["tools/photo-sources.json", "tools/fetch_photos.py", ".github/workflows/photos.yml"]
permissions:
  contents: write
concurrency:
  group: photos
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow==10.4.0
      - name: Fetch photos
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then python tools/fetch_photos.py --only "$ONLY"; else python tools/fetch_photos.py; fi
      - name: Commit new photos
        run: |
          git config user.name "flocks-photos[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos
          if git diff --cached --quiet; then echo "No new photos."; exit 0; fi
          git commit -m "Add bird photos ($(ls photos/*.jpg | wc -l) total)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
